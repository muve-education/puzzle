<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁吸拼圖遊戲</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-top: 0; color: #333; }
        #controls {
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, button, input {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; }
        
        /* 遊戲區域 */
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #fff;
            border: 2px dashed #aaa;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden; /* 防止拼圖被拖到外面 */
        }
        /* 拼圖底板 (提示正確位置) */
        #board {
            position: absolute;
            border: 2px solid #555;
            background-color: #e9e9e9;
            box-sizing: border-box;
            /* 讓底圖有淡淡的浮水印提示 */
            background-size: 100% 100%;
            opacity: 0.3; 
        }
        /* 單塊拼圖 */
        .piece {
            position: absolute;
            cursor: grab;
            background-repeat: no-repeat;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .piece:active {
            cursor: grabbing;
            transform: scale(1.05); /* 拖曳時稍微放大 */
        }
        /* 吸附正確位置後的樣式 */
        .piece.locked {
            cursor: default;
            pointer-events: none; /* 鎖定後無法再點擊拖曳 */
            border: none;
            box-shadow: none;
            z-index: 1 !important; /* 放回底層 */
        }
    </style>
</head>
<body>

    <h1>🧩 磁吸拼圖遊戲</h1>
    <div id="controls">
        <label>上傳圖片: <input type="file" id="image-upload" accept="image/*"></label>
        <label>難度: 
            <select id="piece-count">
                <option value="1,2">2片 (1x2)</option>
                <option value="2,2">4片 (2x2)</option>
                <option value="2,3">6片 (2x3)</option>
                <option value="3,3">9片 (3x3)</option>
                <option value="3,4">12片 (3x4)</option>
                <option value="4,4" selected>16片 (4x4)</option>
            </select>
        </label>
        <button id="start-btn">開始遊戲</button>
    </div>

    <div id="game-container">
        <div id="board"></div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const board = document.getElementById('board');
        const startBtn = document.getElementById('start-btn');
        const imageUpload = document.getElementById('image-upload');
        const pieceCountSelect = document.getElementById('piece-count');

        // 預設圖片 (您可以自行上傳)
        let currentImageUrl = 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=600&auto=format&fit=crop';
        let imgWidth = 0;
        let imgHeight = 0;
        let topZIndex = 10; // 控制拖曳圖層在最上方
        const SNAP_RADIUS = 40; // 磁吸距離 (像素)

        // 處理圖片上傳
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentImageUrl = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        startBtn.addEventListener('click', startGame);

        function startGame() {
            // 清空先前的拼圖
            document.querySelectorAll('.piece').forEach(p => p.remove());
            
            // 讀取設定
            const [rows, cols] = pieceCountSelect.value.split(',').map(Number);
            
            // 載入圖片並計算尺寸
            const img = new Image();
            img.src = currentImageUrl;
            img.onload = () => {
                // 等比例縮放圖片以適應容器 (最大寬高500)
                const maxSize = 500;
                const ratio = Math.min(maxSize / img.width, maxSize / img.height);
                imgWidth = Math.floor(img.width * ratio);
                imgHeight = Math.floor(img.height * ratio);

                // 設定底板大小與置中位置
                const boardX = (gameContainer.clientWidth - imgWidth) / 2;
                const boardY = (gameContainer.clientHeight - imgHeight) / 2;
                board.style.width = imgWidth + 'px';
                board.style.height = imgHeight + 'px';
                board.style.left = boardX + 'px';
                board.style.top = boardY + 'px';
                board.style.backgroundImage = `url(${currentImageUrl})`; // 半透明底圖提示

                createPieces(rows, cols, boardX, boardY, imgWidth, imgHeight);
            };
        }

        function createPieces(rows, cols, boardX, boardY, width, height) {
            const pieceWidth = width / cols;
            const pieceHeight = height / rows;
            let lockedCount = 0;
            const totalPieces = rows * cols;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const piece = document.createElement('div');
                    piece.classList.add('piece');
                    
                    // 拼圖的實際尺寸與背景
                    piece.style.width = pieceWidth + 'px';
                    piece.style.height = pieceHeight + 'px';
                    piece.style.backgroundImage = `url(${currentImageUrl})`;
                    piece.style.backgroundSize = `${width}px ${height}px`;
                    piece.style.backgroundPosition = `-${c * pieceWidth}px -${r * pieceHeight}px`;

                    // 記錄該拼圖的「正確目標位置」(相對於 Game Container)
                    const targetX = boardX + c * pieceWidth;
                    const targetY = boardY + r * pieceHeight;
                    piece.dataset.targetX = targetX;
                    piece.dataset.targetY = targetY;

                    // 隨機打散初始位置 (在容器範圍內)
                    const randomX = Math.random() * (gameContainer.clientWidth - pieceWidth);
                    const randomY = Math.random() * (gameContainer.clientHeight - pieceHeight);
                    piece.style.left = randomX + 'px';
                    piece.style.top = randomY + 'px';

                    gameContainer.appendChild(piece);

                    // 拖曳邏輯
                    let isDragging = false;
                    let startMouseX, startMouseY, startPieceX, startPieceY;

                    piece.addEventListener('mousedown', (e) => {
                        if (piece.classList.contains('locked')) return; // 鎖定後不可拖
                        isDragging = true;
                        topZIndex++;
                        piece.style.zIndex = topZIndex;

                        startMouseX = e.clientX;
                        startMouseY = e.clientY;
                        startPieceX = parseFloat(piece.style.left);
                        startPieceY = parseFloat(piece.style.top);
                    });

                    window.addEventListener('mousemove', (e) => {
                        if (!isDragging) return;
                        const dx = e.clientX - startMouseX;
                        const dy = e.clientY - startMouseY;
                        piece.style.left = (startPieceX + dx) + 'px';
                        piece.style.top = (startPieceY + dy) + 'px';
                    });

                    window.addEventListener('mouseup', (e) => {
                        if (!isDragging) return;
                        isDragging = false;

                        // 計算目前位置與目標位置的距離 (畢氏定理)
                        const currentX = parseFloat(piece.style.left);
                        const currentY = parseFloat(piece.style.top);
                        const dist = Math.sqrt(Math.pow(currentX - targetX, 2) + Math.pow(currentY - targetY, 2));

                        // 磁吸判斷
                        if (dist < SNAP_RADIUS) {
                            piece.style.left = targetX + 'px';
                            piece.style.top = targetY + 'px';
                            piece.classList.add('locked'); // 鎖定拼圖
                            
                            lockedCount++;
                            // 延遲一點點檢查勝利，讓吸附動畫先跑完
                            setTimeout(() => {
                                if (lockedCount === totalPieces) {
                                    alert('🎉 恭喜你完成拼圖！');
                                }
                            }, 100);
                        }
                    });
                }
            }
        }

        // 初始化載入預設遊戲
        window.onload = startGame;
    </script>
</body>
</html>
