<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁吸拼圖遊戲</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { margin: 0 0 15px 0; color: #333; }
        #controls {
            margin-bottom: 15px;
            background: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, button, input {
            padding: 8px 12px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; }

        /* 主遊戲視窗（含左右收納區與中央畫布） */
        #game-wrapper {
            position: relative;
            width: 900px;
            height: 550px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            overflow: hidden;
        }

        /* 左右邊欄 */
        .dock {
            width: 170px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 2px dashed #e0e0e0;
            position: relative;
        }
        #dock-right {
            border-right: none;
            border-left: 2px dashed #e0e0e0;
        }

        /* 中央底板區域 */
        #board-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eaeaea;
        }

        #board {
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            background-size: 100% 100%;
            border: 2px solid #444;
        }

        /* 半透明背景圖 */
        #board-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.25;
            background-size: 100% 100%;
        }

        /* 動態畫出的格線層 */
        #grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            pointer-events: none;
        }
        .grid-cell {
            border: 1px dashed rgba(0, 0, 0, 0.4);
        }

        /* 拼圖塊 */
        .piece {
            position: absolute;
            cursor: grab;
            background-repeat: no-repeat;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.6);
            transform-origin: center center;
            transition: transform 0.15s ease, left 0.25s ease, top 0.25s ease;
            z-index: 10;
        }
        .piece.docked {
            transform: scale(0.55); /* 在兩側收納區縮小顯示 */
        }
        .piece.dragging {
            cursor: grabbing;
            transform: scale(1); /* 抓起時還原為原始尺寸 */
            transition: none; /* 拖曳時取消位置平滑過渡 */
            z-index: 100 !important;
        }
        .piece.locked {
            cursor: default;
            pointer-events: none;
            transform: scale(1);
            box-shadow: none;
            border: none;
            z-index: 1 !important;
        }

        /* 完成時彩帶 Canvas */
        #canvas-confetti {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <h1>🧩 磁吸拼圖遊戲</h1>
    <div id="controls">
        <label>上傳圖片: <input type="file" id="image-upload" accept="image/*"></label>
        <label>難度: 
            <select id="piece-count">
                <option value="1,2">2片 (1x2)</option>
                <option value="2,2">4片 (2x2)</option>
                <option value="2,3">6片 (2x3)</option>
                <option value="3,3">9片 (3x3)</option>
                <option value="3,4">12片 (3x4)</option>
                <option value="4,4" selected>16片 (4x4)</option>
            </select>
        </label>
        <button id="start-btn">開始遊戲</button>
    </div>

    <div id="game-wrapper">
        <div id="dock-left" class="dock"></div>
        <div id="board-container">
            <div id="board">
                <div id="board-bg"></div>
                <div id="grid-overlay"></div>
            </div>
        </div>
        <div id="dock-right" class="dock"></div>
        <canvas id="canvas-confetti"></canvas>
    </div>

    <script>
        const gameWrapper = document.getElementById('game-wrapper');
        const boardContainer = document.getElementById('board-container');
        const board = document.getElementById('board');
        const boardBg = document.getElementById('board-bg');
        const gridOverlay = document.getElementById('grid-overlay');
        const startBtn = document.getElementById('start-btn');
        const imageUpload = document.getElementById('image-upload');
        const pieceCountSelect = document.getElementById('piece-count');
        const canvasConfetti = document.getElementById('canvas-confetti');

        let currentImageUrl = 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=600&auto=format&fit=crop';
        let imgWidth = 0, imgHeight = 0;
        let lockedCount = 0, totalPieces = 0;
        const SNAP_RADIUS = 40;

        // 音效系統 (Web Audio API 合成)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSuccessSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12); // A5
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.12);
        }

        function playErrorSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.18);
        }

        function playVictorySound() {
            initAudio();
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + idx * 0.12);
                osc.stop(audioCtx.currentTime + idx * 0.12 + 0.4);
            });
        }

        // 上傳圖片處理
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { currentImageUrl = e.target.result; startGame(); };
                reader.readAsDataURL(file);
            }
        });

        startBtn.addEventListener('click', () => { initAudio(); startGame(); });

        function startGame() {
            document.querySelectorAll('.piece').forEach(p => p.remove());
            const ctx = canvasConfetti.getContext('2d');
            ctx.clearRect(0, 0, canvasConfetti.width, canvasConfetti.height);

            const [rows, cols] = pieceCountSelect.value.split(',').map(Number);
            totalPieces = rows * cols;
            lockedCount = 0;

            const img = new Image();
            img.src = currentImageUrl;
            img.onload = () => {
                const maxW = 500, maxH = 480;
                const ratio = Math.min(maxW / img.width, maxH / img.height);
                imgWidth = Math.floor(img.width * ratio);
                imgHeight = Math.floor(img.height * ratio);

                board.style.width = imgWidth + 'px';
                board.style.height = imgHeight + 'px';
                boardBg.style.backgroundImage = `url(${currentImageUrl})`;

                // 動態畫網格線
                gridOverlay.innerHTML = '';
                gridOverlay.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                gridOverlay.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
                for (let i = 0; i < totalPieces; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('grid-cell');
                    gridOverlay.appendChild(cell);
                }

                createPieces(rows, cols);
            };
        }

        function createPieces(rows, cols) {
            const pieceW = imgWidth / cols;
            const pieceH = imgHeight / rows;
            const boardRect = board.getBoundingClientRect();
            const wrapperRect = gameWrapper.getBoundingClientRect();
            const boardLeftInWrapper = boardRect.left - wrapperRect.left;
            const boardTopInWrapper = boardRect.top - wrapperRect.top;

            let piecesList = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const piece = document.createElement('div');
                    piece.classList.add('piece', 'docked');
                    piece.style.width = pieceW + 'px';
                    piece.style.height = pieceH + 'px';
                    piece.style.backgroundImage = `url(${currentImageUrl})`;
                    piece.style.backgroundSize = `${imgWidth}px ${imgHeight}px`;
                    piece.style.backgroundPosition = `-${c * pieceW}px -${r * pieceH}px`;

                    const targetX = boardLeftInWrapper + c * pieceW;
                    const targetY = boardTopInWrapper + r * pieceH;
                    piece.dataset.targetX = targetX;
                    piece.dataset.targetY = targetY;

                    piecesList.push(piece);
                }
            }

            // 打散隨機分發到左右兩側收納區
            piecesList.sort(() => Math.random() - 0.5);

            piecesList.forEach((piece, index) => {
                const isLeft = index % 2 === 0;
                const dockSlotIndex = Math.floor(index / 2);
                const colInDock = dockSlotIndex % 2;
                const rowInDock = Math.floor(dockSlotIndex / 2);

                const dockBaseX = isLeft ? 15 : 735;
                const dockBaseY = 20;

                const dockX = dockBaseX + colInDock * (pieceW * 0.5 + 5);
                const dockY = dockBaseY + rowInDock * (pieceH * 0.5 + 10);

                piece.dataset.dockX = dockX;
                piece.dataset.dockY = dockY;
                piece.style.left = dockX + 'px';
                piece.style.top = dockY + 'px';

                gameWrapper.appendChild(piece);
                setupDragEvents(piece);
            });
        }

        function setupDragEvents(piece) {
            let isDragging = false;
            let startMouseX, startMouseY, startPieceX, startPieceY;

            piece.addEventListener('mousedown', (e) => {
                if (piece.classList.contains('locked')) return;
                isDragging = true;
                piece.classList.remove('docked');
                piece.classList.add('dragging');

                startMouseX = e.clientX;
                startMouseY = e.clientY;
                startPieceX = parseFloat(piece.style.left);
                startPieceY = parseFloat(piece.style.top);
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startMouseX;
                const dy = e.clientY - startMouseY;
                piece.style.left = (startPieceX + dx) + 'px';
                piece.style.top = (startPieceY + dy) + 'px';
            });

            window.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                piece.classList.remove('dragging');

                const currentX = parseFloat(piece.style.left);
                const currentY = parseFloat(piece.style.top);
                const targetX = parseFloat(piece.dataset.targetX);
                const targetY = parseFloat(piece.dataset.targetY);

                const dist = Math.sqrt(Math.pow(currentX - targetX, 2) + Math.pow(currentY - targetY, 2));

                // 檢查是否接近專屬正確位置
                if (dist < SNAP_RADIUS) {
                    piece.style.left = targetX + 'px';
                    piece.style.top = targetY + 'px';
                    piece.classList.add('locked');
                    playSuccessSound();

                    lockedCount++;
                    if (lockedCount === totalPieces) {
                        setTimeout(() => {
                            playVictorySound();
                            triggerConfetti();
                        }, 200);
                    }
                } else {
                    // 放錯位置或半途鬆開，彈回兩側收納區原位
                    playErrorSound();
                    piece.classList.add('docked');
                    piece.style.left = piece.dataset.dockX + 'px';
                    piece.style.top = piece.dataset.dockY + 'px';
                }
            });
        }

        // 勝利彩帶效果
        function triggerConfetti() {
            canvasConfetti.width = gameWrapper.clientWidth;
            canvasConfetti.height = gameWrapper.clientHeight;
            const ctx = canvasConfetti.getContext('2d');
            const particles = Array.from({ length: 80 }).map(() => ({
                x: canvasConfetti.width / 2,
                y: canvasConfetti.height / 2,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12 - 4,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                size: Math.random() * 6 + 4
            }));

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvasConfetti.width, canvasConfetti.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2; // 重力
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                if (++frame < 90) requestAnimationFrame(animate);
            }
            animate();
        }

        window.onload = () => {
            canvasConfetti.width = gameWrapper.clientWidth;
            canvasConfetti.height = gameWrapper.clientHeight;
            startGame();
        };
    </script>
</body>
</html>
